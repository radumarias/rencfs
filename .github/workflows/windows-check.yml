name: Windows Build Check

on:
  push:
    branches: [ windows, main ]
  pull_request:
    branches: [ main ]

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install WinFsp (stub)
        run: |
          # WinFsp is delay-loaded; we only need the headers/libs for compilation
          # In a real CI, you'd install WinFsp, but for cargo check we can skip it
          echo "Skipping WinFsp install for cargo check"
      - name: Cargo check (Windows target)
        run: cargo check --target x86_64-pc-windows-msvc --all-features
